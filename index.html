<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palestra · Biblioteca de ejercicios</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#ff4f00" />
  <script>
    // Apply saved theme before first paint to avoid flash
    (function () {
      try {
        var t = localStorage.getItem('palestra-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <style>
    /* ── Reset ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    button { font: inherit; cursor: pointer; border: none; background: none; }
    img { display: block; max-width: 100%; }
    input { font: inherit; }
    ol, ul { list-style: none; }
    summary { list-style: none; cursor: pointer; }
    summary::-webkit-details-marker { display: none; }

    /* ── Focus ──────────────────────────────────────── */
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    :focus:not(:focus-visible) { outline: none; }

    /* ── Design Tokens ──────────────────────────────── */
    :root {
      --bg-base:        #f4f4f5;
      --bg-surface:     #ffffff;
      --bg-elevated:    #f0f0f1;
      --bg-input:       #f4f4f5;
      --border:         #e4e4e7;
      --border-hover:   #c4c4c7;
      --accent:         #ff4f00;
      --accent-muted:   rgba(255, 79, 0, 0.08);
      --accent-text:    #c73b00;
      --accent-contrast:#1a0c04;
      --text-primary:   #111111;
      --text-secondary: #6a6a72;
      --text-tertiary:  #6f6f78;
      --tag-cat-bg:     #e7f0fe;
      --tag-cat-fg:     #1d4ed8;
      --tag-equip-bg:   #e9f9ef;
      --tag-equip-fg:   #15803d;
      --scrollbar:      #d4d4d8;
      --scrollbar-hover:#a1a1aa;
      --shadow-modal:   rgba(0, 0, 0, 0.1);
      --overlay:        rgba(0, 0, 0, 0.45);
      --radius-sm:      6px;
      --radius-md:      10px;
      --radius-lg:      14px;
      --radius-xl:      18px;
      --sidebar-w:      260px;
      color-scheme: light;
    }
    :root[data-theme="dark"] { color-scheme: dark; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { color-scheme: dark; }
    }

    /* Dark palette — shared by explicit toggle and system preference */
    :root[data-theme="dark"] {
      --bg-base:        #0a0a0b;
      --bg-surface:     #141416;
      --bg-elevated:    #1c1c1f;
      --bg-input:       #1c1c1f;
      --border:         #2a2a2e;
      --border-hover:   #3f3f46;
      --accent:         #ff4f00;
      --accent-muted:   rgba(255, 79, 0, 0.16);
      --accent-text:    #ff6a2b;
      --accent-contrast:#1a0c04;
      --text-primary:   #f4f4f5;
      --text-secondary: #a1a1aa;
      --text-tertiary:  #7d7d87;
      --tag-cat-bg:     #1b283e;
      --tag-cat-fg:     #93c5fd;
      --tag-equip-bg:   #163022;
      --tag-equip-fg:   #86efac;
      --scrollbar:      #3f3f46;
      --scrollbar-hover:#52525b;
      --shadow-modal:   rgba(0, 0, 0, 0.5);
      --overlay:        rgba(0, 0, 0, 0.65);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-base:        #0a0a0b;
        --bg-surface:     #141416;
        --bg-elevated:    #1c1c1f;
        --bg-input:       #1c1c1f;
        --border:         #2a2a2e;
        --border-hover:   #3f3f46;
        --accent:         #ff4f00;
        --accent-muted:   rgba(255, 79, 0, 0.16);
        --accent-text:    #ff6a2b;
        --accent-contrast:#1a0c04;
        --text-primary:   #f4f4f5;
        --text-secondary: #a1a1aa;
        --text-tertiary:  #7d7d87;
        --tag-cat-bg:     #1b283e;
        --tag-cat-fg:     #93c5fd;
        --tag-equip-bg:   #163022;
        --tag-equip-fg:   #86efac;
        --scrollbar:      #3f3f46;
        --scrollbar-hover:#52525b;
        --shadow-modal:   rgba(0, 0, 0, 0.5);
        --overlay:        rgba(0, 0, 0, 0.65);
      }
    }

    /* ── Base ───────────────────────────────────────── */
    html, body { height: 100%; }
    body {
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Scrollbar ──────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }

    /* ── App Shell ──────────────────────────────────── */
    .app-shell {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ────────────────────────────────────── */
    .sidebar {
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .sidebar-header {
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg-surface);
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sidebar-logo {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-primary);
    }

    .sidebar-logo span {
      color: var(--accent-text);
    }

    .theme-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .theme-toggle:hover {
      color: var(--text-primary);
      border-color: var(--border-hover);
    }

    .theme-toggle svg { width: 17px; height: 17px; }
    .theme-toggle .icon-sun  { display: none; }
    .theme-toggle .icon-moon { display: block; }
    :root[data-theme="dark"] .theme-toggle .icon-sun  { display: block; }
    :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .theme-toggle .icon-sun  { display: block; }
      :root:not([data-theme="light"]) .theme-toggle .icon-moon { display: none; }
    }

    .sidebar-body {
      padding: 12px 12px 24px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* ── Search ─────────────────────────────────────── */
    .search-wrapper {
      position: relative;
      margin-bottom: 8px;
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-tertiary);
      pointer-events: none;
      width: 14px;
      height: 14px;
    }

    .search-box {
      width: 100%;
      padding: 8px 32px 8px 32px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 13px;
      transition: border-color 0.15s;
    }

    .search-box::placeholder { color: var(--text-tertiary); }
    .search-box:focus { border-color: var(--accent); }

    .search-clear {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-tertiary);
      font-size: 16px;
      line-height: 1;
      display: none;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
    }

    .search-clear:hover { color: var(--text-primary); }
    .search-clear.visible { display: flex; }

    /* ── Filter Sections ────────────────────────────── */
    .filter-section {
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .filter-summary {
      display: flex;
      align-items: center;
      padding: 8px 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-secondary);
      user-select: none;
    }

    .filter-options {
      padding: 4px 2px 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-show-more {
      font-size: 11px;
      color: var(--text-secondary);
      padding: 3px 10px;
      min-height: 34px;
      border-radius: 20px;
      border: 1px dashed var(--border-hover);
      transition: all 0.1s;
    }

    .filter-show-more:hover {
      color: var(--text-primary);
      border-color: var(--text-secondary);
    }

    /* ── Chips ──────────────────────────────────────── */
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      min-height: 34px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      transition: all 0.1s;
      white-space: nowrap;
      text-transform: capitalize;
    }

    .chip:hover {
      border-color: var(--border-hover);
      color: var(--text-primary);
    }

    .chip.active {
      background: var(--accent-muted);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    /* ── Filters wrap / toggle ──────────────────────── */
    .filters-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .filters-toggle { display: none; }

    /* ── Main Content ───────────────────────────────── */
    .main-content {
      overflow-y: auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Results Bar ────────────────────────────────── */
    .results-bar {
      padding: 14px 20px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      background: var(--bg-base);
      z-index: 2;
      border-bottom: 1px solid var(--border);
    }

    .results-count {
      font-size: 12px;
      color: var(--text-secondary);
      margin-right: auto;
    }

    .active-filters {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .active-badge {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 3px 4px 3px 10px;
      min-height: 28px;
      background: var(--accent-muted);
      border: 1px solid var(--accent);
      color: var(--accent-text);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      text-transform: capitalize;
    }

    .active-badge-remove {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-size: 14px;
      line-height: 1;
      color: var(--accent-text);
      opacity: 0.7;
      transition: opacity 0.1s;
    }

    .active-badge-remove:hover { opacity: 1; }

    .clear-all {
      font-size: 11px;
      color: var(--text-secondary);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .clear-all:hover { color: var(--text-primary); }

    /* ── Exercise Grid ──────────────────────────────── */
    .grid-wrapper {
      padding: 16px 20px 32px;
      flex: 1;
    }

    .exercise-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 14px;
    }

    /* ── Skeleton ───────────────────────────────────── */
    .skeleton-card {
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      overflow: hidden;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .skeleton-media {
      aspect-ratio: 3/4;
      background: var(--bg-elevated);
    }

    .skeleton-body { padding: 10px 12px 12px; }

    .skeleton-line {
      height: 10px;
      border-radius: 5px;
      background: var(--bg-elevated);
      margin-bottom: 7px;
    }

    .skeleton-line.short { width: 60%; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* ── Exercise Card ──────────────────────────────── */
    .exercise-card {
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .exercise-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px var(--shadow-modal);
    }

    .exercise-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-color: var(--accent);
    }

    .card-media {
      aspect-ratio: 3/4;
      background: var(--bg-elevated);
      overflow: hidden;
      position: relative;
    }

    .card-thumb,
    .card-gif {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.2s;
    }

    .card-gif { opacity: 0; }
    .exercise-card:hover .card-thumb { opacity: 0; }
    .exercise-card:hover .card-gif { opacity: 1; }

    .card-body {
      padding: 9px 11px 11px;
    }

    .card-name {
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text-primary);
      margin-bottom: 5px;
      text-transform: capitalize;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .tag {
      font-size: 10px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: capitalize;
      letter-spacing: 0.01em;
    }

    .tag-cat  { background: var(--tag-cat-bg); color: var(--tag-cat-fg); }
    .tag-equip { background: var(--tag-equip-bg); color: var(--tag-equip-fg); }

    /* ── Load Sentinel ──────────────────────────────── */
    .load-sentinel {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
    }

    .load-spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .load-spinner.visible { display: block; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Empty State ────────────────────────────────── */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: var(--text-secondary);
    }

    .empty-state p:first-child {
      font-size: 32px;
      margin-bottom: 8px;
    }

    /* ── Modal ──────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      padding: 16px;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      width: min(660px, 100%);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      transform: translateY(10px) scale(0.98);
      transition: transform 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .modal-overlay.open .modal-panel {
      transform: translateY(0) scale(1);
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 18px 0;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
      text-transform: capitalize;
    }

    .modal-close {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
      margin-top: 2px;
    }

    .modal-close:hover {
      background: var(--accent-muted);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .modal-media {
      padding: 14px 18px 0;
    }

    .modal-gif {
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      border-radius: var(--radius-md);
      background: var(--bg-elevated);
    }

    .modal-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 14px 18px 0;
    }

    .meta-chip {
      display: inline-flex;
      flex-direction: column;
      padding: 6px 12px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      gap: 1px;
    }

    .meta-chip-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-tertiary);
    }

    .meta-chip-value {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      text-transform: capitalize;
    }

    .modal-muscles {
      padding: 14px 18px 16px;
      border-bottom: 1px solid var(--border);
    }

    .modal-muscles-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
      margin-bottom: 10px;
    }

    .muscles-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .muscles-group {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 12px;
    }

    .muscles-group-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-tertiary);
      margin-bottom: 7px;
    }

    .muscle-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .muscle-tag {
      font-size: 11px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 5px;
      text-transform: capitalize;
      background: var(--bg-surface);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .muscle-tag.primary {
      background: var(--accent);
      color: var(--accent-contrast);
      border-color: var(--accent);
      font-weight: 600;
    }

    .modal-instructions {
      padding: 0 18px 22px;
    }

    .modal-instructions-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
      padding: 14px 0 0;
      display: block;
    }

    .lang-tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      margin: 10px 0 14px;
    }

    .lang-tab {
      font-size: 13px;
      font-weight: 500;
      padding: 8px 24px;
      border: none;
      background: none;
      color: var(--text-tertiary);
      cursor: pointer;
      position: relative;
      transition: color 0.15s;
      letter-spacing: 0.01em;
    }

    .lang-tab:hover { color: var(--text-secondary); }

    .lang-tab.active { color: var(--text-primary); font-weight: 600; }

    .lang-tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--accent);
      border-radius: 2px 2px 0 0;
    }

    .instructions-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      counter-reset: steps;
    }

    .instruction-step {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      counter-increment: steps;
    }

    .step-num {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      font-size: 10px;
      font-weight: 700;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }

    .step-text {
      font-size: 13px;
      line-height: 1.55;
      color: var(--text-secondary);
    }

    /* ── Responsive ─────────────────────────────────── */
    @media (max-width: 768px) {
      /* Layout */
      .app-shell {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        height: 100dvh;
      }

      /* Sidebar → top panel */
      .sidebar {
        height: auto;
        max-height: 45vh;
        border-right: none;
        border-bottom: 1px solid var(--border);
        overflow-y: auto;
      }

      .sidebar-header {
        padding: 14px 14px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .sidebar-body {
        padding: 10px 12px 16px;
        gap: 10px;
      }

      .search-wrapper { margin-bottom: 4px; }

      .filter-section { width: 100%; }

      /* Collapsible filters — save vertical space */
      .filters-toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        padding: 8px 10px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border);
        background: var(--bg-elevated);
        color: var(--text-secondary);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }

      .filters-toggle-count {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 16px;
        height: 16px;
        padding: 0 4px;
        border-radius: 8px;
        background: var(--accent);
        color: var(--accent-contrast);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0;
      }
      .filters-toggle-count[hidden] { display: none; }

      .filters-toggle-chevron {
        width: 14px;
        height: 14px;
        margin-left: auto;
        transition: transform 0.15s ease;
      }
      .filters-toggle[aria-expanded="true"] .filters-toggle-chevron { transform: rotate(180deg); }

      .filters-wrap {
        display: none;
        margin-top: 8px;
      }
      .filters-wrap.open { display: flex; }

      .filter-summary { padding: 6px 4px; }

      .filter-options {
        overflow-x: auto;
        flex-wrap: nowrap;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        padding-bottom: 2px;
      }
      .filter-options::-webkit-scrollbar { display: none; }

      /* Main */
      .main-content { height: auto; flex: 1; overflow-y: auto; }

      .results-bar { padding: 10px 14px 8px; }

      .grid-wrapper { padding: 12px 12px 28px; }

      .exercise-grid {
        grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
        gap: 10px;
      }

      /* Modal → bottom sheet */
      .modal-overlay {
        align-items: flex-end;
        padding: 0;
      }

      .modal-panel {
        width: 100%;
        max-height: 92dvh;
        border-radius: var(--radius-xl) var(--radius-xl) 0 0;
        border-bottom: none;
      }

      .modal-gif { max-height: 240px; }

      /* Muscles grid → single col on small */
      .muscles-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 480px) {
      .exercise-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .grid-wrapper { padding: 10px 10px 24px; }

      .modal-panel { max-height: 95dvh; }

      .modal-header { padding: 16px 16px 0; }
      .modal-media  { padding: 12px 16px 0; }
      .modal-meta   { padding: 12px 16px 0; }
      .modal-muscles      { padding: 12px 16px 14px; }
      .modal-instructions { padding: 0 16px 20px; }

      .lang-tab { padding: 8px 18px; }

      .card-name { font-size: 11.5px; }
    }

    /* ── Top 3 por músculo ──────────────────────────── */
    .top3-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      white-space: nowrap;
      transition: color .15s, border-color .15s, background .15s;
    }
    .top3-toggle:hover { border-color: var(--border-hover); color: var(--text-primary); }
    .top3-toggle.active {
      color: var(--accent-contrast);
      background: var(--accent);
      border-color: var(--accent);
    }

    .top3-view { display: none; }
    .top3-view.visible { display: block; }

    .top3-intro {
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-secondary);
      background: var(--accent-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 20px;
    }

    .top3-section { margin-bottom: 28px; }

    .top3-section-head {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }
    .top3-section-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      text-transform: capitalize;
    }
    .top3-section-sub {
      font-size: 11px;
      color: var(--text-tertiary);
    }
    .top3-section-note {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-bottom: 10px;
    }

    .top3-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    @media (max-width: 640px) {
      .top3-row { grid-template-columns: 1fr; }
    }

    .top3-item { position: relative; }
    .top3-item .medal-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 7px 2px 5px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-primary);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      box-shadow: 0 1px 3px var(--shadow-modal);
    }
  </style>
</head>
<body>

<div class="app-shell">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">Pale<span>stra</span></div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Cambiar tema" title="Cambiar tema">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
      </button>
    </div>
    <div class="sidebar-body">
      <!-- Search -->
      <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="6.5" cy="6.5" r="4.5"/>
          <path d="M10.5 10.5L14 14" stroke-linecap="round"/>
        </svg>
        <input type="search" class="search-box" id="search" placeholder="Buscar ejercicios…" autocomplete="off" />
        <button class="search-clear" id="search-clear" aria-label="Limpiar búsqueda">×</button>
      </div>

      <!-- Filters toggle (mobile only) -->
      <button class="filters-toggle" id="filters-toggle" type="button" aria-expanded="false" aria-controls="filters-wrap">
        <span>Filtros</span>
        <span class="filters-toggle-count" id="filters-toggle-count" hidden></span>
        <svg class="filters-toggle-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6l4 4 4-4"/>
        </svg>
      </button>

      <div class="filters-wrap" id="filters-wrap">
        <!-- Category filter -->
        <div class="filter-section">
          <div class="filter-summary">Categoría</div>
          <div class="filter-options" id="category-chips"></div>
        </div>

        <!-- Equipment filter -->
        <div class="filter-section">
          <div class="filter-summary">Equipamiento</div>
          <div class="filter-options" id="equipment-chips"></div>
        </div>

        <!-- Target filter -->
        <div class="filter-section">
          <div class="filter-summary">Músculo objetivo</div>
          <div class="filter-options" id="target-chips"></div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div class="results-bar">
      <div class="active-filters" id="active-filters"></div>
      <span class="results-count" id="results-count" role="status" aria-live="polite"></span>
      <button class="top3-toggle" id="top3-toggle" type="button" aria-pressed="false">
        🏆 Top 3 por músculo
      </button>
    </div>
    <div class="grid-wrapper">
      <div class="exercise-grid" id="exercise-grid"></div>
      <div class="load-sentinel" id="load-sentinel">
        <div class="load-spinner" id="load-spinner"></div>
      </div>
      <div class="top3-view" id="top3-view"></div>
    </div>
  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-panel" id="modal-panel">
    <div class="modal-header">
      <h2 class="modal-title" id="modal-title"></h2>
      <button class="modal-close" id="modal-close" aria-label="Cerrar">✕</button>
    </div>
    <div class="modal-media">
      <img class="modal-gif" id="modal-gif" alt="" />
    </div>
    <div class="modal-meta" id="modal-meta"></div>
    <div class="modal-muscles" id="modal-muscles"></div>
    <div class="modal-instructions" id="modal-instructions"></div>
  </div>
</div>

<script>
  // Exercise data is loaded at runtime from data/exercises.min.json — see boot().

  // ── State ──────────────────────────────────────────
  const state = {
    exercises: [],
    filtered: [],
    search: '',
    filters: {
      category: new Set(),
      equipment: new Set(),
      target: new Set(),
    },
    page: 0,
    pageSize: 60,
    top3: false,
  };

  // Equipment items to show initially (rest behind "show more")
  const EQUIP_INITIAL = 10;

  // ── Top 3 por músculo objetivo ─────────────────────
  // Selección orientativa a partir de la literatura de electromiografía (EMG)
  // y biomecánica: se priorizan ejercicios compuestos, con carga libre y rango
  // completo de movimiento. Los IDs corresponden a data/exercises.json.
  const TOP3 = [
    { target: 'pectorals',           ids: ['0025', '0047', '0251'] },
    { target: 'lats',                ids: ['0652', '2330', '0027'] },
    { target: 'upper back',          ids: ['0027', '0180', '1351'] },
    { target: 'delts',               ids: ['0091', '0334', '0383'] },
    { target: 'traps',               ids: ['0095', '0406', '0548'] },
    { target: 'biceps',              ids: ['0031', '0318', '0070'] },
    { target: 'triceps',             ids: ['1755', '0060', '0200'] },
    { target: 'forearms',            ids: ['0126', '0082', '0364'] },
    { target: 'quads',               ids: ['2287', '1760', '0585'],
      note: 'En el dataset la sentadilla con barra y la prensa con barra están etiquetadas como «glúteos»; aquí solo aparecen los ejercicios marcados como cuádriceps.' },
    { target: 'hamstrings',          ids: ['0586', '0116', '3193'] },
    { target: 'glutes',              ids: ['0043', '0085', '1409'],
      note: 'La sentadilla profunda y el peso muerto rumano también cargan de forma intensa cuádriceps e isquiotibiales.' },
    { target: 'calves',              ids: ['1372', '0594', '0284'] },
    { target: 'abs',                 ids: ['0472', '0832', '0084'] },
    { target: 'spine',               ids: ['0489', '0835', '0573'],
      note: 'El dataset etiqueta los "buenos días" y el peso muerto como isquiotibiales/glúteos; aquí se listan las extensiones lumbares disponibles.' },
    { target: 'adductors',           ids: ['0168', '0598', '1775'],
      note: 'Datos limitados en el dataset para este músculo.' },
    { target: 'abductors',           ids: ['0597', '3006', '0710'],
      note: 'Datos limitados en el dataset para este músculo.' },
    { target: 'serratus anterior',   ids: ['0050', '3011', '3021'],
      note: 'Datos limitados en el dataset para este músculo.' },
    { target: 'levator scapulae',    ids: ['1403', '0716'],
      note: 'El dataset solo incluye estiramientos para este músculo.' },
    { target: 'cardiovascular system', ids: ['1160', '2612', '0685'],
      note: 'Ranking por demanda cardiorrespiratoria, no por activación muscular (EMG).' },
  ];

  // ── DOM Refs ───────────────────────────────────────
  const gridEl        = document.getElementById('exercise-grid');
  const sentinelEl    = document.getElementById('load-sentinel');
  const spinnerEl     = document.getElementById('load-spinner');
  const countEl       = document.getElementById('results-count');
  const activeFilEl   = document.getElementById('active-filters');
  const searchEl      = document.getElementById('search');
  const searchClearEl = document.getElementById('search-clear');
  const modalOverlay  = document.getElementById('modal-overlay');
  const modalTitle    = document.getElementById('modal-title');
  const modalGif      = document.getElementById('modal-gif');
  const modalMeta     = document.getElementById('modal-meta');
  const modalMuscles  = document.getElementById('modal-muscles');
  const modalInstr    = document.getElementById('modal-instructions');
  const modalClose    = document.getElementById('modal-close');
  const themeToggleEl = document.getElementById('theme-toggle');
  const filtersToggleEl      = document.getElementById('filters-toggle');
  const filtersToggleCountEl = document.getElementById('filters-toggle-count');
  const filtersWrapEl        = document.getElementById('filters-wrap');
  const top3ToggleEl         = document.getElementById('top3-toggle');
  const top3ViewEl           = document.getElementById('top3-view');
  const appShellEl           = document.querySelector('.app-shell');
  const modalPanelEl         = document.getElementById('modal-panel');
  let   lastFocusedEl        = null;

  // ── Utility ────────────────────────────────────────
  function debounce(fn, ms) {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
  }

  function capitalize(str) {
    return str ? str.charAt(0).toUpperCase() + str.slice(1) : '';
  }

  function uniqueSorted(arr) {
    return [...new Set(arr)].sort();
  }

  // ── ES translations for data values (display only; filter keys stay English) ──
  const ES = {
    // category / body_part
    'back': 'espalda', 'cardio': 'cardio', 'chest': 'pecho', 'lower arms': 'antebrazos',
    'lower legs': 'pantorrillas', 'neck': 'cuello', 'shoulders': 'hombros',
    'upper arms': 'brazos', 'upper legs': 'piernas', 'waist': 'abdomen',
    // equipment
    'assisted': 'asistido', 'band': 'banda', 'barbell': 'barra', 'body weight': 'peso corporal',
    'bosu ball': 'bosu', 'cable': 'polea', 'dumbbell': 'mancuerna',
    'elliptical machine': 'elíptica', 'ez barbell': 'barra z', 'hammer': 'martillo',
    'kettlebell': 'pesa rusa', 'leverage machine': 'máquina de palanca',
    'medicine ball': 'balón medicinal', 'olympic barbell': 'barra olímpica',
    'resistance band': 'banda de resistencia', 'roller': 'rodillo', 'rope': 'cuerda',
    'skierg machine': 'máquina skierg', 'sled machine': 'trineo', 'smith machine': 'máquina smith',
    'stability ball': 'fitball', 'stationary bike': 'bicicleta estática',
    'stepmill machine': 'escaladora', 'tire': 'neumático', 'trap bar': 'barra hexagonal',
    'upper body ergometer': 'ergómetro de brazos', 'weighted': 'con peso',
    'wheel roller': 'rueda abdominal',
    // target / muscles
    'abductors': 'abductores', 'abs': 'abdominales', 'adductors': 'aductores',
    'biceps': 'bíceps', 'calves': 'pantorrillas', 'cardiovascular system': 'sistema cardiovascular',
    'delts': 'deltoides', 'forearms': 'antebrazos', 'glutes': 'glúteos',
    'hamstrings': 'isquiotibiales', 'lats': 'dorsales', 'levator scapulae': 'elevador de la escápula',
    'pectorals': 'pectorales', 'quads': 'cuádriceps', 'serratus anterior': 'serrato anterior',
    'spine': 'columna', 'traps': 'trapecios', 'triceps': 'tríceps', 'upper back': 'espalda alta',
    'abdominals': 'abdominales', 'ankle stabilizers': 'estabilizadores del tobillo',
    'ankles': 'tobillos', 'core': 'core', 'deltoids': 'deltoides', 'hands': 'manos',
    'hip flexors': 'flexores de cadera', 'latissimus dorsi': 'dorsal ancho',
    'lower back': 'zona lumbar', 'obliques': 'oblicuos', 'quadriceps': 'cuádriceps',
    'rhomboids': 'romboides', 'rotator cuff': 'manguito rotador', 'soleus': 'sóleo',
    'trapezius': 'trapecio', 'wrist extensors': 'extensores de muñeca',
    'wrist flexors': 'flexores de muñeca', 'wrists': 'muñecas',
    'brachialis': 'braquial', 'feet': 'pies', 'grip muscles': 'músculos de agarre',
    'groin': 'ingle', 'inner thighs': 'cara interna del muslo', 'lower abs': 'abdomen bajo',
    'rear deltoids': 'deltoides posteriores', 'shins': 'espinillas',
    'sternocleidomastoid': 'esternocleidomastoideo', 'upper chest': 'pecho superior',
  };
  function tr(v) {
    if (v == null) return '';
    return ES[String(v).toLowerCase()] ?? v;
  }

  // ── Data Loading ───────────────────────────────────
  const DATA_URL = 'data/exercises.min.json';

  function init(data) {
    state.exercises = data;

    // Pre-compute search index per exercise
    state.exercises.forEach(ex => {
      ex._idx = `${ex.name} ${ex.category} ${ex.target} ${ex.equipment} ${ex.muscle_group} ${tr(ex.category)} ${tr(ex.target)} ${tr(ex.equipment)} ${tr(ex.muscle_group)}`.toLowerCase();
    });

    buildFilterOptions();
    readURL();
    applyFilters();

    if (location.hash === '#top3') setTop3(true);
  }

  // ── URL State (filters + search in ?query, view mode in #hash) ──
  const URL_KEYS = ['category', 'equipment', 'target'];

  function readURL() {
    const p = new URLSearchParams(location.search);
    state.search = p.get('q') || '';
    searchEl.value = state.search;
    searchClearEl.classList.toggle('visible', state.search.length > 0);
    URL_KEYS.forEach(k => {
      state.filters[k] = new Set((p.get(k) || '').split(',').filter(Boolean));
    });
    document.querySelectorAll('.chip[data-filter]').forEach(c => {
      if (c.classList.contains('filter-show-more')) return;
      c.classList.toggle('active', !!state.filters[c.dataset.filter]?.has(c.dataset.value));
    });
  }

  function syncURL() {
    const p = new URLSearchParams();
    if (state.search) p.set('q', state.search);
    URL_KEYS.forEach(k => {
      if (state.filters[k].size) p.set(k, [...state.filters[k]].join(','));
    });
    const qs = p.toString();
    const url = location.pathname + (qs ? '?' + qs : '') + (state.top3 ? '#top3' : '');
    history.replaceState(null, '', url);
  }

  function loadData() {
    renderSkeletons(24);
    countEl.textContent = 'Cargando ejercicios…';

    fetch(DATA_URL)
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      })
      .then(init)
      .catch(err => {
        console.error('No se pudo cargar el dataset:', err);
        countEl.textContent = '';
        gridEl.innerHTML = '';
        const box = document.createElement('div');
        box.className = 'empty-state';
        box.setAttribute('role', 'alert');
        box.innerHTML =
          '<p>⚠️</p><p>No se pudieron cargar los ejercicios.</p>'
          + '<p style="font-size:12px;margin-top:4px">'
          + 'Esta página necesita servirse por HTTP (GitHub Pages o un servidor local); '
          + 'no funciona abriendo el archivo directamente.</p>';
        const retry = document.createElement('button');
        retry.className = 'top3-toggle';
        retry.style.marginTop = '14px';
        retry.textContent = 'Reintentar';
        retry.addEventListener('click', loadData);
        box.appendChild(retry);
        gridEl.appendChild(box);
      });
  }

  // ── Build Filter Chips ─────────────────────────────
  function buildFilterOptions() {
    const cats   = uniqueSorted(state.exercises.map(e => e.category));
    const equips = uniqueSorted(state.exercises.map(e => e.equipment));
    const targets = uniqueSorted(state.exercises.map(e => e.target));

    renderChips('category-chips',  cats,   'category');
    renderChips('equipment-chips', equips, 'equipment');
    renderChips('target-chips',    targets,'target');
  }

  function renderChips(containerId, values, filterKey, initialLimit = null) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';

    const toShow = initialLimit ? values.slice(0, initialLimit) : values;
    const rest   = initialLimit ? values.slice(initialLimit) : [];

    toShow.forEach(val => {
      container.appendChild(makeChip(val, filterKey));
    });

    if (rest.length > 0) {
      // Hidden chips
      const hiddenWrap = document.createElement('div');
      hiddenWrap.style.cssText = 'display:none;flex-wrap:wrap;gap:8px;width:100%;';
      rest.forEach(val => hiddenWrap.appendChild(makeChip(val, filterKey)));
      container.appendChild(hiddenWrap);

      // Show more button
      const moreBtn = document.createElement('button');
      moreBtn.className = 'chip filter-show-more';
      moreBtn.textContent = `+${rest.length} más`;
      moreBtn.addEventListener('click', () => {
        hiddenWrap.style.display = 'flex';
        moreBtn.remove();
      });
      container.appendChild(moreBtn);
    }
  }

  function makeChip(value, filterKey) {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = tr(value);
    btn.dataset.filter = filterKey;
    btn.dataset.value  = value;
    return btn;
  }

  // ── Filter Logic ───────────────────────────────────
  function toggleFilter(key, value) {
    const set = state.filters[key];
    if (set.has(value)) set.delete(value);
    else set.add(value);
  }

  function applyFilters() {
    if (state.top3) setTop3(false, false);
    const q = state.search.toLowerCase().trim();
    const { category, equipment, target } = state.filters;

    state.filtered = state.exercises.filter(ex => {
      if (q && !ex._idx.includes(q)) return false;
      if (category.size  && !category.has(ex.category))   return false;
      if (equipment.size && !equipment.has(ex.equipment))  return false;
      if (target.size    && !target.has(ex.target))        return false;
      return true;
    });

    state.page = 0;
    renderGrid();
    updateResultsBar();
    updateActiveBadges();
    updateFiltersToggleCount();
    syncURL();
  }

  function updateFiltersToggleCount() {
    const { category, equipment, target } = state.filters;
    const n = category.size + equipment.size + target.size;
    filtersToggleCountEl.textContent = n;
    filtersToggleCountEl.hidden = n === 0;
  }

  // ── Rendering ──────────────────────────────────────
  function renderGrid() {
    gridEl.innerHTML = '';
    const slice = state.filtered.slice(0, state.pageSize);

    if (slice.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.setAttribute('role', 'status');
      empty.innerHTML = '<p>🔍</p><p>No se encontraron ejercicios</p>';
      gridEl.appendChild(empty);
      spinnerEl.classList.remove('visible');
      return;
    }

    const frag = document.createDocumentFragment();
    slice.forEach(ex => frag.appendChild(createCard(ex)));
    gridEl.appendChild(frag);

    const hasMore = state.filtered.length > state.pageSize;
    spinnerEl.classList.toggle('visible', hasMore);
  }

  function appendNextPage() {
    state.page++;
    const start = state.page * state.pageSize;
    const end   = start + state.pageSize;
    const slice = state.filtered.slice(start, end);
    if (slice.length === 0) return;

    const frag = document.createDocumentFragment();
    slice.forEach(ex => frag.appendChild(createCard(ex)));
    gridEl.appendChild(frag);

    const hasMore = end < state.filtered.length;
    spinnerEl.classList.toggle('visible', hasMore);
  }

  function createCard(ex) {
    const article = document.createElement('article');
    article.className = 'exercise-card';
    article.dataset.id = ex.id;
    article.tabIndex = 0;
    article.setAttribute('role', 'button');
    article.setAttribute('aria-label', `${ex.name} — ver detalles`);

    // Media
    const media = document.createElement('div');
    media.className = 'card-media';

    const thumb = document.createElement('img');
    thumb.className = 'card-thumb';
    thumb.src = ex.image;
    thumb.alt = ex.name;
    thumb.loading = 'lazy';

    const gif = document.createElement('img');
    gif.className = 'card-gif';
    gif.dataset.src = ex.gif_url;
    gif.alt = '';

    media.appendChild(thumb);
    media.appendChild(gif);

    // Body
    const body = document.createElement('div');
    body.className = 'card-body';

    const name = document.createElement('h3');
    name.className = 'card-name';
    name.textContent = ex.name;

    const tags = document.createElement('div');
    tags.className = 'card-tags';

    const catTag = document.createElement('span');
    catTag.className = 'tag tag-cat';
    catTag.textContent = tr(ex.category);

    const equipTag = document.createElement('span');
    equipTag.className = 'tag tag-equip';
    equipTag.textContent = tr(ex.equipment);

    tags.appendChild(catTag);
    tags.appendChild(equipTag);
    body.appendChild(name);
    body.appendChild(tags);
    article.appendChild(media);
    article.appendChild(body);

    return article;
  }

  function renderSkeletons(count) {
    gridEl.innerHTML = '';
    const frag = document.createDocumentFragment();
    for (let i = 0; i < count; i++) {
      const card = document.createElement('div');
      card.className = 'skeleton-card';
      card.innerHTML = `
        <div class="skeleton-media"></div>
        <div class="skeleton-body">
          <div class="skeleton-line"></div>
          <div class="skeleton-line short"></div>
        </div>`;
      frag.appendChild(card);
    }
    gridEl.appendChild(frag);
  }

  // ── Top 3 View ─────────────────────────────────────
  const MEDALS = ['🥇', '🥈', '🥉'];
  let _exById = null;
  function exById(id) {
    if (!_exById) _exById = new Map(state.exercises.map(e => [e.id, e]));
    return _exById.get(id);
  }

  function renderTop3() {
    top3ViewEl.innerHTML = '';

    const intro = document.createElement('p');
    intro.className = 'top3-intro';
    intro.textContent = 'Selección orientativa basada en la literatura de electromiografía (EMG) y '
      + 'biomecánica: se priorizan ejercicios compuestos, con carga libre y rango completo de '
      + 'movimiento. No sustituye la individualización del entrenamiento. Al usar un filtro '
      + 'o la búsqueda volverás a la lista completa.';
    top3ViewEl.appendChild(intro);

    const frag = document.createDocumentFragment();

    TOP3.forEach(({ target, ids, note }) => {
      const exs = ids.map(exById).filter(Boolean);
      if (exs.length === 0) return;

      const section = document.createElement('section');
      section.className = 'top3-section';

      const head = document.createElement('div');
      head.className = 'top3-section-head';
      head.innerHTML = `<span class="top3-section-title">${tr(target)}</span>`
        + `<span class="top3-section-sub">${target}</span>`;
      section.appendChild(head);

      if (note) {
        const noteEl = document.createElement('p');
        noteEl.className = 'top3-section-note';
        noteEl.textContent = note;
        section.appendChild(noteEl);
      }

      const row = document.createElement('div');
      row.className = 'top3-row';
      exs.forEach((ex, i) => {
        const item = document.createElement('div');
        item.className = 'top3-item';
        const card = createCard(ex);
        const badge = document.createElement('span');
        badge.className = 'medal-badge';
        badge.textContent = `${MEDALS[i] || ''} ${i + 1}º`;
        card.querySelector('.card-media').appendChild(badge);
        item.appendChild(card);
        row.appendChild(item);
      });
      section.appendChild(row);
      frag.appendChild(section);
    });

    top3ViewEl.appendChild(frag);
  }

  function setTop3(on, sync = true) {
    state.top3 = on;
    top3ToggleEl.classList.toggle('active', on);
    top3ToggleEl.setAttribute('aria-pressed', String(on));
    top3ViewEl.classList.toggle('visible', on);
    gridEl.style.display   = on ? 'none' : '';
    sentinelEl.style.display = on ? 'none' : '';
    if (on) {
      if (!top3ViewEl.hasChildNodes()) renderTop3();
      window.scrollTo({ top: 0 });
    }
    if (sync) syncURL();
  }

  // ── Results Bar ────────────────────────────────────
  function updateResultsBar() {
    const total = state.filtered.length;
    const all   = state.exercises.length;
    countEl.textContent = total === all
      ? `${all.toLocaleString()} ejercicios`
      : `${total.toLocaleString()} de ${all.toLocaleString()} ejercicios`;
  }

  function updateActiveBadges() {
    activeFilEl.innerHTML = '';
    const { category, equipment, target } = state.filters;
    let hasAny = false;

    const addBadges = (set, key) => {
      set.forEach(val => {
        hasAny = true;
        const badge = document.createElement('span');
        badge.className = 'active-badge';
        badge.innerHTML = `${tr(val)}<button class="active-badge-remove" data-filter="${key}" data-value="${val}" aria-label="Quitar ${tr(val)}">×</button>`;
        activeFilEl.appendChild(badge);
      });
    };

    addBadges(category,  'category');
    addBadges(equipment, 'equipment');
    addBadges(target,    'target');

    if (hasAny) {
      const clearAll = document.createElement('button');
      clearAll.className = 'clear-all';
      clearAll.textContent = 'Limpiar todo';
      clearAll.addEventListener('click', clearAllFilters);
      activeFilEl.appendChild(clearAll);
    }
  }

  function clearAllFilters() {
    state.filters.category.clear();
    state.filters.equipment.clear();
    state.filters.target.clear();
    state.search = '';
    searchEl.value = '';
    searchClearEl.classList.remove('visible');

    // Deactivate all chips
    document.querySelectorAll('.chip.active').forEach(c => c.classList.remove('active'));
    applyFilters();
  }

  // ── Modal ──────────────────────────────────────────
  function openModal(id) {
    const ex = state.exercises.find(e => e.id === id);
    if (!ex) return;

    modalTitle.textContent = ex.name;
    modalGif.src = ex.gif_url;
    modalGif.alt = ex.name;

    // Meta chips
    modalMeta.innerHTML = '';
    const metaItems = [
      { label: 'Zona del cuerpo', value: ex.body_part || ex.category },
      { label: 'Equipamiento',    value: ex.equipment },
      { label: 'Músculo objetivo', value: ex.target },
    ];
    metaItems.forEach(({ label, value }) => {
      const chip = document.createElement('div');
      chip.className = 'meta-chip';
      chip.innerHTML = `<span class="meta-chip-label">${label}</span><span class="meta-chip-value">${tr(value)}</span>`;
      modalMeta.appendChild(chip);
    });

    // Muscles
    modalMuscles.innerHTML = '';
    const primaryMuscles = ex.target ? [ex.target] : [];
    const secondaryRaw = ex.secondary_muscles || (ex.muscle_group ? [ex.muscle_group] : []);
    const secondaryMuscles = secondaryRaw.filter(m => m !== ex.target);

    const musclesHeader = document.createElement('div');
    musclesHeader.className = 'modal-muscles-label';
    musclesHeader.textContent = 'Músculos';
    modalMuscles.appendChild(musclesHeader);

    const musclesGrid = document.createElement('div');
    musclesGrid.className = 'muscles-grid';

    const makeMuscleGroup = (title, names, isPrimary) => {
      const group = document.createElement('div');
      group.className = 'muscles-group';
      const lbl = document.createElement('div');
      lbl.className = 'muscles-group-label';
      lbl.textContent = title;
      const row = document.createElement('div');
      row.className = 'muscle-tags';
      names.forEach(name => {
        const t = document.createElement('span');
        t.className = 'muscle-tag' + (isPrimary ? ' primary' : '');
        t.textContent = tr(name);
        row.appendChild(t);
      });
      group.appendChild(lbl);
      group.appendChild(row);
      return group;
    };

    if (primaryMuscles.length > 0)   musclesGrid.appendChild(makeMuscleGroup('Principal', primaryMuscles, true));
    if (secondaryMuscles.length > 0)  musclesGrid.appendChild(makeMuscleGroup('Secundario', secondaryMuscles, false));
    if (primaryMuscles.length > 0 || secondaryMuscles.length > 0) modalMuscles.appendChild(musclesGrid);

    // Instructions — Spanish only
    modalInstr.innerHTML = '';
    const steps = ex.instruction_steps?.es ?? [];

    if (steps.length > 0) {
      const instrLabel = document.createElement('span');
      instrLabel.className = 'modal-instructions-label';
      instrLabel.textContent = 'Instrucciones';
      modalInstr.appendChild(instrLabel);

      const list = document.createElement('ol');
      list.className = 'instructions-list';
      steps.forEach((step, i) => {
        const li = document.createElement('li');
        li.className = 'instruction-step';
        li.innerHTML = `<span class="step-num">${i + 1}</span><span class="step-text">${step}</span>`;
        list.appendChild(li);
      });
      modalInstr.appendChild(list);
    }

    lastFocusedEl = document.activeElement;
    modalOverlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    if (appShellEl) appShellEl.inert = true;
    modalClose.focus();
  }

  function closeModal() {
    if (!modalOverlay.classList.contains('open')) return;
    modalOverlay.classList.remove('open');
    document.body.style.overflow = '';
    modalGif.src = '';
    if (appShellEl) appShellEl.inert = false;
    if (lastFocusedEl && document.contains(lastFocusedEl)) lastFocusedEl.focus();
    lastFocusedEl = null;
  }

  // Keep Tab focus inside the open modal
  function trapModalFocus(e) {
    if (e.key !== 'Tab' || !modalOverlay.classList.contains('open')) return;
    const items = modalPanelEl.querySelectorAll(
      'a[href], button:not([disabled]), input, [tabindex]:not([tabindex="-1"])'
    );
    if (!items.length) { e.preventDefault(); return; }
    const first = items[0];
    const last = items[items.length - 1];
    if (!modalPanelEl.contains(document.activeElement)) {
      e.preventDefault(); first.focus();
    } else if (e.shiftKey && document.activeElement === first) {
      e.preventDefault(); last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault(); first.focus();
    }
  }

  // ── Theme ──────────────────────────────────────────
  function currentTheme() {
    const attr = document.documentElement.getAttribute('data-theme');
    if (attr === 'dark' || attr === 'light') return attr;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  // Keyboard activation for exercise cards (role="button")
  function onCardKeydown(e) {
    if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
    const card = e.target.closest('.exercise-card');
    if (!card) return;
    e.preventDefault();
    openModal(card.dataset.id);
  }

  // ── Events ─────────────────────────────────────────
  function wireEvents() {
    // Theme toggle
    themeToggleEl.addEventListener('click', () => {
      const next = currentTheme() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('palestra-theme', next); } catch (e) {}
    });

    // Top 3 por músculo toggle
    top3ToggleEl.addEventListener('click', () => setTop3(!state.top3));

    // Top 3 view: card hover → load GIF, card click → modal
    top3ViewEl.addEventListener('mouseover', e => {
      const card = e.target.closest('.exercise-card');
      if (!card) return;
      const gif = card.querySelector('.card-gif');
      if (gif && gif.dataset.src && !gif.src) gif.src = gif.dataset.src;
    });
    top3ViewEl.addEventListener('click', e => {
      const card = e.target.closest('.exercise-card');
      if (card) openModal(card.dataset.id);
    });

    // Filters collapse (mobile)
    filtersToggleEl.addEventListener('click', () => {
      const open = filtersWrapEl.classList.toggle('open');
      filtersToggleEl.setAttribute('aria-expanded', String(open));
    });

    // Search
    searchEl.addEventListener('input', debounce(() => {
      state.search = searchEl.value;
      searchClearEl.classList.toggle('visible', state.search.length > 0);
      applyFilters();
    }, 250));

    searchClearEl.addEventListener('click', () => {
      searchEl.value = '';
      state.search = '';
      searchClearEl.classList.remove('visible');
      applyFilters();
    });

    // Filter chips (delegated)
    document.querySelector('.sidebar-body').addEventListener('click', e => {
      const chip = e.target.closest('[data-filter]');
      if (!chip || chip.classList.contains('filter-show-more')) return;
      const { filter, value } = chip.dataset;
      toggleFilter(filter, value);
      chip.classList.toggle('active');
      applyFilters();
    });

    // Remove active badge
    activeFilEl.addEventListener('click', e => {
      const btn = e.target.closest('.active-badge-remove');
      if (!btn) return;
      const { filter, value } = btn.dataset;
      state.filters[filter].delete(value);
      // Deactivate corresponding chip
      const chip = document.querySelector(`.chip[data-filter="${filter}"][data-value="${value}"]`);
      if (chip) chip.classList.remove('active');
      applyFilters();
    });

    // Card hover → load GIF
    gridEl.addEventListener('mouseover', e => {
      const card = e.target.closest('.exercise-card');
      if (!card) return;
      const gif = card.querySelector('.card-gif');
      if (gif && gif.dataset.src && !gif.src) {
        gif.src = gif.dataset.src;
      }
    });

    // Card activate → modal (click + keyboard)
    gridEl.addEventListener('click', e => {
      const card = e.target.closest('.exercise-card');
      if (card) openModal(card.dataset.id);
    });
    gridEl.addEventListener('keydown', onCardKeydown);
    top3ViewEl.addEventListener('keydown', onCardKeydown);

    // Modal close
    modalClose.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', e => {
      if (e.target === modalOverlay) closeModal();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
      else trapModalFocus(e);
    });

    // Infinite scroll
    const observer = new IntersectionObserver(entries => {
      if (entries[0].isIntersecting && spinnerEl.classList.contains('visible')) {
        appendNextPage();
      }
    }, { rootMargin: '200px' });
    observer.observe(sentinelEl);
  }


  // ── Boot ───────────────────────────────────────────
  wireEvents();
  loadData();

  // Back/forward and manual hash edits — filters/search live in ?query, view in #hash
  window.addEventListener('popstate', () => {
    if (!state.exercises.length) return;
    if (location.hash === '#top3') setTop3(true, false);
    else { readURL(); applyFilters(); }
  });
  window.addEventListener('hashchange', () => {
    if (!state.exercises.length) return;
    if (location.hash === '#top3') setTop3(true, false);
    else if (state.top3) applyFilters();
  });

</script>
</body>
</html>
