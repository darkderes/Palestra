<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palestra · Biblioteca de ejercicios</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="stylesheet" href="assets/log.css" />
  <meta name="theme-color" content="#ff4f00" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" />
  <!-- Apply saved theme before first paint to avoid flash -->
  <script src="assets/theme-init.js"></script>
  <style>
    /* ── Reset ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    button { font: inherit; cursor: pointer; border: none; background: none; }
    img { display: block; max-width: 100%; }
    input { font: inherit; }
    ol, ul { list-style: none; }
    summary { list-style: none; cursor: pointer; }
    summary::-webkit-details-marker { display: none; }

    /* ── Focus ──────────────────────────────────────── */
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    :focus:not(:focus-visible) { outline: none; }

    /* ── Reduced motion ─────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ── Design Tokens ──────────────────────────────── */
    :root {
      --bg-base:        #f4f4f5;
      --bg-surface:     #ffffff;
      --bg-elevated:    #f0f0f1;
      --bg-input:       #f4f4f5;
      --border:         #e4e4e7;
      --border-hover:   #c4c4c7;
      --accent:         #ff4f00;
      --accent-muted:   rgba(255, 79, 0, 0.08);
      --accent-text:    #c73b00;
      --accent-contrast:#1a0c04;
      --text-primary:   #111111;
      --text-secondary: #6a6a72;
      --text-tertiary:  #6f6f78;
      --tag-cat-bg:     #e7f0fe;
      --tag-cat-fg:     #1d4ed8;
      --tag-equip-bg:   #e9f9ef;
      --tag-equip-fg:   #15803d;
      --scrollbar:      #d4d4d8;
      --scrollbar-hover:#a1a1aa;
      --shadow-modal:   rgba(0, 0, 0, 0.1);
      --overlay:        rgba(0, 0, 0, 0.45);
      --radius-sm:      6px;
      --radius-md:      10px;
      --radius-lg:      14px;
      --radius-xl:      18px;
      --sidebar-w:      260px;
      color-scheme: light;
    }
    :root[data-theme="dark"] { color-scheme: dark; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { color-scheme: dark; }
    }

    /* Dark palette — shared by explicit toggle and system preference */
    :root[data-theme="dark"] {
      --bg-base:        #0a0a0b;
      --bg-surface:     #141416;
      --bg-elevated:    #1c1c1f;
      --bg-input:       #1c1c1f;
      --border:         #2a2a2e;
      --border-hover:   #3f3f46;
      --accent:         #ff4f00;
      --accent-muted:   rgba(255, 79, 0, 0.16);
      --accent-text:    #ff6a2b;
      --accent-contrast:#1a0c04;
      --text-primary:   #f4f4f5;
      --text-secondary: #a1a1aa;
      --text-tertiary:  #7d7d87;
      --tag-cat-bg:     #1b283e;
      --tag-cat-fg:     #93c5fd;
      --tag-equip-bg:   #163022;
      --tag-equip-fg:   #86efac;
      --scrollbar:      #3f3f46;
      --scrollbar-hover:#52525b;
      --shadow-modal:   rgba(0, 0, 0, 0.5);
      --overlay:        rgba(0, 0, 0, 0.65);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-base:        #0a0a0b;
        --bg-surface:     #141416;
        --bg-elevated:    #1c1c1f;
        --bg-input:       #1c1c1f;
        --border:         #2a2a2e;
        --border-hover:   #3f3f46;
        --accent:         #ff4f00;
        --accent-muted:   rgba(255, 79, 0, 0.16);
        --accent-text:    #ff6a2b;
        --accent-contrast:#1a0c04;
        --text-primary:   #f4f4f5;
        --text-secondary: #a1a1aa;
        --text-tertiary:  #7d7d87;
        --tag-cat-bg:     #1b283e;
        --tag-cat-fg:     #93c5fd;
        --tag-equip-bg:   #163022;
        --tag-equip-fg:   #86efac;
        --scrollbar:      #3f3f46;
        --scrollbar-hover:#52525b;
        --shadow-modal:   rgba(0, 0, 0, 0.5);
        --overlay:        rgba(0, 0, 0, 0.65);
      }
    }

    /* ── Base ───────────────────────────────────────── */
    html, body { height: 100%; }
    body {
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Scrollbar ──────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }

    /* ── App Shell ──────────────────────────────────── */
    .app-shell {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ────────────────────────────────────── */
    .sidebar {
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .sidebar-header {
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg-surface);
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sidebar-logo {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-primary);
    }

    .sidebar-logo span {
      color: var(--accent-text);
    }

    .theme-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .theme-toggle:hover {
      color: var(--text-primary);
      border-color: var(--border-hover);
    }

    .theme-toggle svg { width: 17px; height: 17px; }
    .theme-toggle .icon-sun  { display: none; }
    .theme-toggle .icon-moon { display: block; }
    :root[data-theme="dark"] .theme-toggle .icon-sun  { display: block; }
    :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .theme-toggle .icon-sun  { display: block; }
      :root:not([data-theme="light"]) .theme-toggle .icon-moon { display: none; }
    }

    .sidebar-body {
      padding: 12px 12px 24px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* ── Search ─────────────────────────────────────── */
    .search-wrapper {
      position: relative;
      margin-bottom: 8px;
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-tertiary);
      pointer-events: none;
      width: 14px;
      height: 14px;
    }

    .search-box {
      width: 100%;
      padding: 8px 32px 8px 32px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 13px;
      transition: border-color 0.15s;
    }

    .search-box::placeholder { color: var(--text-tertiary); }
    .search-box:focus { border-color: var(--accent); }

    .search-clear {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-tertiary);
      font-size: 16px;
      line-height: 1;
      display: none;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
    }

    .search-clear:hover { color: var(--text-primary); }
    .search-clear.visible { display: flex; }

    /* ── Filter Sections ────────────────────────────── */
    .filter-section {
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .filter-summary {
      display: flex;
      align-items: center;
      padding: 8px 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-secondary);
      user-select: none;
    }

    .filter-options {
      padding: 4px 2px 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-show-more {
      font-size: 11px;
      color: var(--text-secondary);
      padding: 3px 10px;
      min-height: 34px;
      border-radius: 20px;
      border: 1px dashed var(--border-hover);
      transition: all 0.1s;
    }

    .filter-show-more:hover {
      color: var(--text-primary);
      border-color: var(--text-secondary);
    }

    /* ── Chips ──────────────────────────────────────── */
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      min-height: 34px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      transition: all 0.1s;
      white-space: nowrap;
      text-transform: capitalize;
    }

    .chip:hover {
      border-color: var(--border-hover);
      color: var(--text-primary);
    }

    .chip.active {
      background: var(--accent-muted);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    /* ── Filters wrap / toggle ──────────────────────── */
    .filters-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .filters-toggle { display: none; }

    /* ── Main Content ───────────────────────────────── */
    .main-content {
      overflow-y: auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Results Bar ────────────────────────────────── */
    .results-bar {
      padding: 14px 20px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      background: var(--bg-base);
      z-index: 2;
      border-bottom: 1px solid var(--border);
    }

    .results-count {
      font-size: 12px;
      color: var(--text-secondary);
      margin-right: auto;
    }

    .active-filters {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .active-badge {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 3px 4px 3px 10px;
      min-height: 28px;
      background: var(--accent-muted);
      border: 1px solid var(--accent);
      color: var(--accent-text);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      text-transform: capitalize;
    }

    .active-badge-remove {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-size: 14px;
      line-height: 1;
      color: var(--accent-text);
      opacity: 0.7;
      transition: opacity 0.1s;
    }

    .active-badge-remove:hover { opacity: 1; }

    .clear-all {
      font-size: 11px;
      color: var(--text-secondary);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .clear-all:hover { color: var(--text-primary); }

    /* ── Exercise Grid ──────────────────────────────── */
    .grid-wrapper {
      padding: 16px 20px 32px;
      flex: 1;
    }

    .exercise-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 14px;
    }

    /* ── Skeleton ───────────────────────────────────── */
    .skeleton-card {
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      overflow: hidden;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .skeleton-media {
      aspect-ratio: 3/4;
      background: var(--bg-elevated);
    }

    .skeleton-body { padding: 10px 12px 12px; }

    .skeleton-line {
      height: 10px;
      border-radius: 5px;
      background: var(--bg-elevated);
      margin-bottom: 7px;
    }

    .skeleton-line.short { width: 60%; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* ── Exercise Card ──────────────────────────────── */
    .exercise-card {
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .exercise-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px var(--shadow-modal);
    }

    .exercise-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-color: var(--accent);
    }

    .card-media {
      aspect-ratio: 3/4;
      background: var(--bg-elevated);
      overflow: hidden;
      position: relative;
    }

    .card-thumb,
    .card-gif {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.2s;
    }

    .card-gif { opacity: 0; }
    .exercise-card:hover .card-thumb { opacity: 0; }
    .exercise-card:hover .card-gif { opacity: 1; }

    .card-body {
      padding: 9px 11px 11px;
    }

    .card-name {
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text-primary);
      margin-bottom: 5px;
      text-transform: capitalize;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .tag {
      font-size: 10px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: capitalize;
      letter-spacing: 0.01em;
    }

    .tag-cat  { background: var(--tag-cat-bg); color: var(--tag-cat-fg); }
    .tag-equip { background: var(--tag-equip-bg); color: var(--tag-equip-fg); }

    /* ── Load Sentinel ──────────────────────────────── */
    .load-sentinel {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
    }

    .load-spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .load-spinner.visible { display: block; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Empty State ────────────────────────────────── */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: var(--text-secondary);
    }

    .empty-state p:first-child {
      font-size: 32px;
      margin-bottom: 8px;
    }

    /* ── Modal ──────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      padding: 16px;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      width: min(660px, 100%);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      transform: translateY(10px) scale(0.98);
      transition: transform 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .modal-overlay.open .modal-panel {
      transform: translateY(0) scale(1);
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 18px 0;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
      text-transform: capitalize;
    }

    .modal-close {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
      margin-top: 2px;
    }

    .modal-close:hover {
      background: var(--accent-muted);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .modal-media {
      padding: 14px 18px 0;
    }

    .modal-gif {
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      border-radius: var(--radius-md);
      background: var(--bg-elevated);
    }

    .modal-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 14px 18px 0;
    }

    .meta-chip {
      display: inline-flex;
      flex-direction: column;
      padding: 6px 12px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      gap: 1px;
    }

    .meta-chip-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-tertiary);
    }

    .meta-chip-value {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      text-transform: capitalize;
    }

    .modal-muscles {
      padding: 14px 18px 16px;
      border-bottom: 1px solid var(--border);
    }

    .modal-muscles-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
      margin-bottom: 10px;
    }

    .muscles-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .muscles-group {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 12px;
    }

    .muscles-group-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-tertiary);
      margin-bottom: 7px;
    }

    .muscle-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .muscle-tag {
      font-size: 11px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 5px;
      text-transform: capitalize;
      background: var(--bg-surface);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .muscle-tag.primary {
      background: var(--accent);
      color: var(--accent-contrast);
      border-color: var(--accent);
      font-weight: 600;
    }

    .modal-instructions {
      padding: 0 18px 22px;
    }

    .modal-instructions-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
      padding: 14px 0 0;
      display: block;
    }

    .lang-tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      margin: 10px 0 14px;
    }

    .lang-tab {
      font-size: 13px;
      font-weight: 500;
      padding: 8px 24px;
      border: none;
      background: none;
      color: var(--text-tertiary);
      cursor: pointer;
      position: relative;
      transition: color 0.15s;
      letter-spacing: 0.01em;
    }

    .lang-tab:hover { color: var(--text-secondary); }

    .lang-tab.active { color: var(--text-primary); font-weight: 600; }

    .lang-tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--accent);
      border-radius: 2px 2px 0 0;
    }

    .instructions-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      counter-reset: steps;
    }

    .instruction-step {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      counter-increment: steps;
    }

    .step-num {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      font-size: 10px;
      font-weight: 700;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }

    .step-text {
      font-size: 13px;
      line-height: 1.55;
      color: var(--text-secondary);
    }

    /* ── Responsive ─────────────────────────────────── */
    @media (max-width: 768px) {
      /* Layout */
      .app-shell {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        height: 100dvh;
      }

      /* Sidebar → top panel */
      .sidebar {
        height: auto;
        max-height: 45vh;
        border-right: none;
        border-bottom: 1px solid var(--border);
        overflow-y: auto;
      }

      .sidebar-header {
        padding: 14px 14px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .sidebar-body {
        padding: 10px 12px 16px;
        gap: 10px;
      }

      .search-wrapper { margin-bottom: 4px; }

      .filter-section { width: 100%; }

      /* Collapsible filters — save vertical space */
      .filters-toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        padding: 8px 10px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border);
        background: var(--bg-elevated);
        color: var(--text-secondary);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }

      .filters-toggle-count {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 16px;
        height: 16px;
        padding: 0 4px;
        border-radius: 8px;
        background: var(--accent);
        color: var(--accent-contrast);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0;
      }
      .filters-toggle-count[hidden] { display: none; }

      .filters-toggle-chevron {
        width: 14px;
        height: 14px;
        margin-left: auto;
        transition: transform 0.15s ease;
      }
      .filters-toggle[aria-expanded="true"] .filters-toggle-chevron { transform: rotate(180deg); }

      .filters-wrap {
        display: none;
        margin-top: 8px;
      }
      .filters-wrap.open { display: flex; }

      .filter-summary { padding: 6px 4px; }

      .filter-options {
        overflow-x: auto;
        flex-wrap: nowrap;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        padding-bottom: 2px;
      }
      .filter-options::-webkit-scrollbar { display: none; }

      /* Main */
      .main-content { height: auto; flex: 1; overflow-y: auto; }

      .results-bar { padding: 10px 14px 8px; }

      .grid-wrapper { padding: 12px 12px 28px; }

      .exercise-grid {
        grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
        gap: 10px;
      }

      /* Modal → bottom sheet */
      .modal-overlay {
        align-items: flex-end;
        padding: 0;
      }

      .modal-panel {
        width: 100%;
        max-height: 92dvh;
        border-radius: var(--radius-xl) var(--radius-xl) 0 0;
        border-bottom: none;
      }

      .modal-gif { max-height: 240px; }

      /* Muscles grid → single col on small */
      .muscles-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 480px) {
      .exercise-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .grid-wrapper { padding: 10px 10px 24px; }

      .modal-panel { max-height: 95dvh; }

      .modal-header { padding: 16px 16px 0; }
      .modal-media  { padding: 12px 16px 0; }
      .modal-meta   { padding: 12px 16px 0; }
      .modal-muscles      { padding: 12px 16px 14px; }
      .modal-instructions { padding: 0 16px 20px; }

      .lang-tab { padding: 8px 18px; }

      .card-name { font-size: 11.5px; }
    }

    /* ── Top 3 por músculo ──────────────────────────── */
    .top3-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      white-space: nowrap;
      transition: color .15s, border-color .15s, background .15s;
    }
    .top3-toggle:hover { border-color: var(--border-hover); color: var(--text-primary); }
    .top3-toggle.active {
      color: var(--accent-contrast);
      background: var(--accent);
      border-color: var(--accent);
    }

    .top3-view { display: none; }
    .top3-view.visible { display: block; }

    .top3-intro {
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-secondary);
      background: var(--accent-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 20px;
    }

    .top3-section { margin-bottom: 28px; }

    .top3-section-head {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }
    .top3-section-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      text-transform: capitalize;
    }
    .top3-section-sub {
      font-size: 11px;
      color: var(--text-tertiary);
    }
    .top3-section-note {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-bottom: 10px;
    }

    .top3-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    @media (max-width: 640px) {
      .top3-row { grid-template-columns: 1fr; }
    }

    .top3-item { position: relative; }
    .top3-item .medal-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 7px 2px 5px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-primary);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      box-shadow: 0 1px 3px var(--shadow-modal);
    }
  </style>
</head>
<body>

<div class="app-shell">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">Pale<span>stra</span></div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Cambiar tema" title="Cambiar tema">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
      </button>
    </div>
    <div class="sidebar-body">
      <!-- Search -->
      <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="6.5" cy="6.5" r="4.5"/>
          <path d="M10.5 10.5L14 14" stroke-linecap="round"/>
        </svg>
        <input type="search" class="search-box" id="search" placeholder="Buscar ejercicios…" autocomplete="off" />
        <button class="search-clear" id="search-clear" aria-label="Limpiar búsqueda">×</button>
      </div>

      <!-- Filters toggle (mobile only) -->
      <button class="filters-toggle" id="filters-toggle" type="button" aria-expanded="false" aria-controls="filters-wrap">
        <span>Filtros</span>
        <span class="filters-toggle-count" id="filters-toggle-count" hidden></span>
        <svg class="filters-toggle-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6l4 4 4-4"/>
        </svg>
      </button>

      <div class="filters-wrap" id="filters-wrap">
        <!-- Category filter -->
        <div class="filter-section">
          <div class="filter-summary">Categoría</div>
          <div class="filter-options" id="category-chips"></div>
        </div>

        <!-- Equipment filter -->
        <div class="filter-section">
          <div class="filter-summary">Equipamiento</div>
          <div class="filter-options" id="equipment-chips"></div>
        </div>

        <!-- Target filter -->
        <div class="filter-section">
          <div class="filter-summary">Músculo objetivo</div>
          <div class="filter-options" id="target-chips"></div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div class="results-bar">
      <div class="active-filters" id="active-filters"></div>
      <span class="results-count" id="results-count" role="status" aria-live="polite"></span>
      <button class="top3-toggle" id="top3-toggle" type="button" aria-pressed="false">
        🏆 Top 3 por músculo
      </button>
      <button class="top3-toggle" id="log-toggle" type="button" aria-pressed="false">
        📋 Mis entrenamientos
      </button>
      <button class="top3-toggle" id="pick-cancel" type="button" hidden>
        Cancelar selección
      </button>
    </div>
    <div class="grid-wrapper">
      <div class="exercise-grid" id="exercise-grid"></div>
      <div class="load-sentinel" id="load-sentinel">
        <div class="load-spinner" id="load-spinner"></div>
      </div>
      <div class="top3-view" id="top3-view"></div>
      <section id="log-view" hidden></section>
    </div>
  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-panel" id="modal-panel">
    <div class="modal-header">
      <h2 class="modal-title" id="modal-title"></h2>
      <button class="modal-close" id="modal-close" aria-label="Cerrar">✕</button>
    </div>
    <div class="modal-media">
      <img class="modal-gif" id="modal-gif" alt="" />
    </div>
    <div class="modal-cta" id="modal-cta"></div>
    <div class="modal-meta" id="modal-meta"></div>
    <div class="modal-muscles" id="modal-muscles"></div>
    <div class="modal-instructions" id="modal-instructions"></div>
  </div>
</div>

<script src="assets/ui.js"></script>
<script src="assets/store.js"></script>
<script src="assets/app.js"></script>
<script src="assets/log.js"></script>
</body>
</html>
